<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Claryo — Ask Claryo</title>
<script src="auth.js"></script>
<script>requireAuth();</script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
<style>
/* ════════════════════════════════════════════════════
   CLARYO DESIGN SYSTEM — iOS Dark
════════════════════════════════════════════════════ */
:root {
  --bg:             #000000;
  --surface:        #1c1c1e;
  --surface-raised: #2c2c2e;
  --surface-high:   #3a3a3c;
  --border:         rgba(255, 255, 255, 0.08);
  --separator:      rgba(255, 255, 255, 0.05);
  --border-focus:   rgba(10, 132, 255, 0.55);
  --text-primary:   #ffffff;
  --text-secondary: #8e8e93;
  --text-tertiary:  #48484a;
  --accent:         #0a84ff;
  --accent-hover:   #2c9aff;
  --accent-dim:     rgba(10, 132, 255, 0.14);
  --green:          #30d158;
  --red:            #ff453a;
  --yellow:         #ffd60a;
  --orange:         #ff9f0a;
  --font:         -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  --radius-sm:   8px;
  --radius-md:   12px;
  --radius-lg:   16px;
  --radius-xl:   20px;
  --radius-full: 9999px;
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --ease: 0.18s cubic-bezier(.4,0,.2,1);

  --sidebar-collapsed: 104px;
  --sidebar-expanded:  240px;
  --chat-sidebar-w: 260px;
  --cs-bg:       #1c1c1e;
  --cs-border:   rgba(255, 255, 255, 0.08);
  --cs-hover:    #2c2c2e;
  --cs-text:     #ffffff;
  --cs-muted:    #48484a;
  --cs-sub:      #8e8e93;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  display: flex;
  gap: 24px;
  padding: 24px 36px;
  height: 100vh;
  overflow: hidden;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: var(--radius-full); }

/* ════════════════════
   SIDEBAR
════════════════════ */
#sidebar {
  width: var(--sidebar-collapsed);
  flex-shrink: 0;
  transition: width 0.35s cubic-bezier(.4,0,.2,1);
  overflow: hidden;
  background: var(--surface);
  border-radius: 18px;
  border: 1px solid var(--border);
  position: sticky;
  top: 0;
  height: 100%;
  z-index: 50;
  display: flex;
  flex-direction: column;
  padding: 24px 0 20px 0;
  cursor: pointer;
}
#sidebar.expanded { width: var(--sidebar-expanded); }

.brand-name {
  opacity: 0; width: 0; overflow: hidden; white-space: nowrap;
  transition: opacity 0.25s ease 0.05s, width 0.3s ease;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}
#sidebar.expanded .brand-name { opacity: 1; width: auto; }

.sidebar-label {
  opacity: 0; width: 0; overflow: hidden; white-space: nowrap;
  transition: opacity 0.25s ease 0.05s, width 0.3s ease;
  font-size: 14px;
  font-weight: 500;
  color: inherit;
}
#sidebar.expanded .sidebar-label { opacity: 1; width: auto; }

.nav-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-3);
  padding: 0;
  border-radius: var(--radius-md);
  width: 100%;
  background: transparent;
  border: none;
  color: var(--text-tertiary);
  cursor: pointer;
  white-space: nowrap;
  height: 44px;
  transition: background var(--ease), color var(--ease);
}
.nav-item:hover { color: var(--text-primary); }
.nav-item.active { color: var(--accent); }

.nav-icon-pill {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 15px;
  transition: background var(--ease);
}
.nav-item:hover .nav-icon-pill { background: var(--surface-raised); }
.nav-item.active .nav-icon-pill { background: var(--accent-dim); color: var(--accent); }

#sidebar.expanded .nav-item { padding: 0 10px; justify-content: flex-start; }
#sidebar.expanded .nav-icon-pill { width: 32px; height: 32px; border-radius: 9px; }

/* ════════════════════
   MAIN SHELL
════════════════════ */
#main-content {
  flex-grow: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  height: 100%;
  overflow: hidden;
}

/* ════════════════════
   TOPBAR
════════════════════ */
.topbar {
  height: 80px;
  background: var(--surface);
  border-radius: 18px;
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  flex-shrink: 0;
}
.topbar-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.search-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.search-wrap i {
  position: absolute;
  left: 12px;
  color: var(--text-tertiary);
  font-size: 12px;
  pointer-events: none;
}
.search-wrap input {
  background: var(--surface-raised);
  border: none;
  border-radius: var(--radius-full);
  padding: 7px 14px 7px 32px;
  width: 200px;
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  font-family: var(--font);
  transition: box-shadow var(--ease), width var(--ease);
}
.search-wrap input:focus {
  box-shadow: 0 0 0 2px var(--border-focus);
  width: 240px;
}
.search-wrap input::placeholder { color: var(--text-tertiary); }

.icon-btn {
  width: 36px; height: 36px;
  border-radius: var(--radius-md);
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  position: relative;
  transition: background var(--ease), color var(--ease);
}
.icon-btn:hover { background: var(--surface-raised); color: var(--text-primary); }

.notif-dot {
  position: absolute; top: 6px; right: 6px;
  width: 7px; height: 7px;
  background: var(--orange);
  border-radius: 50%;
  border: 1.5px solid var(--surface);
}

/* ── Account dropdown ── */
.account-wrap { position: relative; }
.account-dropdown {
  display: none;
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  width: 210px;
  background: var(--surface-raised);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 6px;
  z-index: 300;
  box-shadow: 0 16px 40px rgba(0,0,0,0.7), 0 2px 8px rgba(0,0,0,0.4);
  animation: dropFade 0.16s cubic-bezier(.4,0,.2,1);
}
.account-dropdown.open { display: block; }
@keyframes dropFade {
  from { opacity:0; transform: translateY(-6px) scale(0.98); }
  to   { opacity:1; transform: translateY(0) scale(1); }
}
.account-dropdown::before {
  content: '';
  position: absolute;
  top: -5px; right: 12px;
  width: 9px; height: 9px;
  background: var(--surface-raised);
  border-left: 1px solid var(--border);
  border-top: 1px solid var(--border);
  transform: rotate(45deg);
}
.acc-profile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 10px 8px 10px;
  border-bottom: 1px solid var(--separator);
  margin-bottom: 4px;
}
.acc-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--accent-dim);
  border: 1.5px solid rgba(10,132,255,0.3);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 13px; font-weight: 700;
  color: var(--accent);
}
.acc-name  { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.acc-email { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
.acc-item {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px;
  border-radius: var(--radius-md);
  font-size: 13px; color: var(--text-secondary);
  cursor: pointer;
  transition: background var(--ease), color var(--ease);
  border: none; background: none; width: 100%;
  text-align: left; font-family: var(--font);
}
.acc-item:hover { background: var(--surface-high); color: var(--text-primary); }
.acc-item.danger { color: var(--red); }
.acc-item.danger:hover { background: rgba(255,69,58,0.1); color: var(--red); }
.acc-item i { width: 14px; text-align: center; font-size: 12px; flex-shrink: 0; }

/* ════════════════════
   CHAT TILE
════════════════════ */
.chat-tile {
  flex-grow: 1;
  display: flex;
  overflow: hidden;
  border-radius: 18px;
  border: 1px solid var(--border);
  min-height: 0;
  background: var(--bg);
}

/* ════════════════════
   CHAT HISTORY SIDEBAR
════════════════════ */
.chat-sidebar-wrap {
  position: relative;
  display: flex;
  flex-shrink: 0;
}
.chat-sidebar {
  width: var(--chat-sidebar-w);
  background: var(--cs-bg);
  border-right: 1px solid var(--cs-border);
  display: flex;
  flex-direction: column;
  height: 100%;
  flex-shrink: 0;
  transition: width 0.35s cubic-bezier(.4,0,.2,1), border-color 0.35s ease;
  overflow: hidden;
}
.chat-sidebar.collapsed { width: 0; border-right-color: transparent; }
.chat-sidebar.resizing  { transition: none !important; }

.chat-sidebar-inner {
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  height: 100%;
  width: var(--chat-sidebar-w);
  min-width: var(--chat-sidebar-w);
  flex-shrink: 0;
  overflow: hidden;
}
.chat-sidebar-text {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  opacity: 1;
  transition: opacity 0.15s ease;
}
.chat-sidebar.collapsed .chat-sidebar-text { opacity: 0; }

.chat-sidebar-footer {
  padding-top: var(--space-4);
  border-top: 1px solid var(--separator);
  flex-shrink: 0;
  opacity: 1;
  transition: opacity 0.15s ease;
}
.chat-sidebar.collapsed .chat-sidebar-footer { opacity: 0; }

.resize-handle {
  position: absolute; right: -4px; top: 0;
  width: 8px; height: 100%;
  cursor: col-resize; z-index: 20;
  display: flex; align-items: center; justify-content: center;
}
.resize-handle::after {
  content: ''; width: 3px; height: 48px; border-radius: 3px;
  background: transparent; transition: background 0.18s ease;
}
.resize-handle:hover::after, .resize-handle.dragging::after { background: var(--accent); }

.sidebar-toggle {
  background: transparent; border: none; cursor: pointer;
  color: var(--cs-muted);
  display: flex; align-items: center; justify-content: center;
  width: 28px; height: 28px;
  border-radius: var(--radius-sm); font-size: 11px;
  transition: background var(--ease), color var(--ease); flex-shrink: 0;
}
.sidebar-toggle:hover { background: var(--cs-hover); color: var(--cs-text); }

.reopen-btn {
  display: none; align-items: center; justify-content: center;
  width: 28px; height: 28px;
  background: var(--surface-raised); border: none;
  border-radius: var(--radius-md);
  color: var(--text-secondary); font-size: 11px;
  cursor: pointer;
  transition: background var(--ease), color var(--ease); flex-shrink: 0;
}
.reopen-btn:hover { background: var(--surface-high); color: var(--text-primary); }
.reopen-btn.visible { display: flex; }

.chat-sidebar-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-6); padding: 0 var(--space-2);
}
.chat-sidebar-header h1 {
  font-family: var(--font-display); font-size: 17px; font-weight: 600;
  letter-spacing: -0.02em; color: var(--cs-text);
}
.chat-search-btn {
  background: transparent; border: none; cursor: pointer;
  color: var(--cs-muted);
  display: flex; align-items: center; justify-content: center;
  padding: 4px; border-radius: var(--radius-sm); transition: color var(--ease);
}
.chat-search-btn:hover { color: var(--cs-sub); }

.btn-new-chat {
  width: 100%; background: var(--accent); color: #ffffff;
  border: none; cursor: pointer; border-radius: var(--radius-lg);
  padding: 11px var(--space-4);
  display: flex; align-items: center; justify-content: center; gap: var(--space-2);
  font-family: var(--font); font-size: 14px; font-weight: 500;
  letter-spacing: -0.01em; margin-bottom: var(--space-8);
  transition: background var(--ease), transform var(--ease);
}
.btn-new-chat:hover { background: var(--accent-hover); }
.btn-new-chat:active { transform: scale(0.97); }
.btn-new-chat span.star { font-size: 11px; opacity: 0.7; }

.chat-sidebar-scroll {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column; gap: var(--space-6);
}
.chat-sidebar-scroll::-webkit-scrollbar { width: 3px; }
.chat-sidebar-scroll::-webkit-scrollbar-thumb { background: var(--surface-raised); }

.chat-section-label {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--space-2); margin-bottom: var(--space-3);
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--cs-muted);
}
.saved-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
.saved-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px var(--space-2); border-radius: var(--radius-md);
  cursor: pointer; transition: background var(--ease);
}
.saved-item:hover { background: var(--cs-hover); }
.saved-item-left { display: flex; align-items: center; gap: var(--space-3); }
.saved-avatar {
  width: 24px; height: 24px; border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; flex-shrink: 0;
}
.saved-avatar-blue   { background: var(--accent-dim); color: var(--accent); }
.saved-avatar-orange { background: rgba(255,159,10,0.14); color: var(--orange); }
.saved-avatar-purple { background: rgba(191,90,242,0.14); color: #bf5af2; }
.saved-item-label {
  font-size: 13px; color: var(--cs-sub);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1; min-width: 0;
}
.saved-item-more {
  background: transparent; border: none; cursor: pointer;
  color: var(--cs-muted); opacity: 0; font-size: 13px;
  padding: 2px 4px; border-radius: var(--radius-sm); transition: opacity var(--ease);
}
.saved-item:hover .saved-item-more { opacity: 1; }

.history-list { display: flex; flex-direction: column; gap: 1px; }
.history-item {
  padding: 7px var(--space-2); border-radius: var(--radius-md); cursor: pointer;
  font-size: 13px; color: var(--cs-sub);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background var(--ease);
}
.history-item:hover { background: var(--cs-hover); }

.btn-upgrade {
  width: 100%; background: transparent;
  border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer;
  border-radius: var(--radius-lg); padding: 10px var(--space-4);
  font-family: var(--font); font-size: 13px; font-weight: 500;
  transition: background var(--ease), color var(--ease);
}
.btn-upgrade:hover { background: var(--surface-raised); color: var(--text-primary); }

/* ════════════════════
   CHAT MAIN AREA
════════════════════ */
.chat-main {
  flex-grow: 1; min-width: 0;
  display: flex; flex-direction: column;
  background: var(--bg); position: relative;
}
.chat-inner-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-4) var(--space-6);
  border-bottom: 1px solid var(--separator); flex-shrink: 0;
}
.chat-inner-left { display: flex; align-items: center; gap: var(--space-2); }
.chat-inner-title {
  font-family: var(--font-display); font-size: 17px; font-weight: 700;
  letter-spacing: -0.03em; color: var(--text-primary);
}
.badge-plus {
  font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-dim);
  border-radius: var(--radius-sm); padding: 2px 7px;
}
.chat-inner-right { display: flex; align-items: center; gap: var(--space-2); }

.ci-btn {
  display: flex; align-items: center; gap: var(--space-2);
  padding: 7px 14px; background: var(--surface); border: none;
  border-radius: var(--radius-full); color: var(--text-secondary);
  font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer;
  transition: background var(--ease), color var(--ease);
}
.ci-btn:hover { background: var(--surface-raised); color: var(--text-primary); }

.ci-btn-primary {
  display: flex; align-items: center; gap: var(--space-2);
  padding: 7px 16px; background: var(--accent); border: none;
  border-radius: var(--radius-full); color: #fff;
  font-family: var(--font); font-size: 13px; font-weight: 500; cursor: pointer;
  transition: background var(--ease), transform var(--ease);
}
.ci-btn-primary:hover { background: var(--accent-hover); }
.ci-btn-primary:active { transform: scale(0.97); }

.conversation {
  flex: 1; overflow-y: auto;
  padding: var(--space-8) var(--space-6);
  display: flex; flex-direction: column; align-items: stretch; gap: 0;
}
.conversation::-webkit-scrollbar { width: 3px; }
.conversation::-webkit-scrollbar-thumb { background: var(--surface-raised); }

.conv-inner {
  width: 100%; max-width: 760px; margin: 0 auto;
  display: flex; flex-direction: column; gap: var(--space-4); flex: 1;
}
.conv-inner.empty { align-items: center; justify-content: center; }

.welcome {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: var(--space-3); text-align: center;
  user-select: none; pointer-events: none;
}
.welcome-title {
  font-family: var(--font-display); font-size: 64px; font-weight: 700;
  letter-spacing: -0.04em; color: var(--text-tertiary); line-height: 1; opacity: 0.45;
}
.welcome-sub {
  font-size: 16px; font-weight: 400; color: var(--text-tertiary);
  letter-spacing: -0.01em; opacity: 0.35;
}

.input-area { padding: 0 var(--space-6) var(--space-6); flex-shrink: 0; }
.input-area-inner { max-width: 760px; margin: 0 auto; }

.input-wrapper {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-xl); padding: var(--space-4) var(--space-5) var(--space-4);
  transition: border-color var(--ease), box-shadow var(--ease);
}
.input-wrapper:focus-within {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(10,132,255,0.08);
}

.chat-textarea {
  width: 100%; background: transparent; border: none; outline: none; resize: none;
  font-family: var(--font); font-size: 14px; color: var(--text-primary);
  letter-spacing: -0.01em; line-height: 1.6;
  min-height: 64px; max-height: 200px; overflow-y: auto;
  display: block; margin-bottom: var(--space-3);
}
.chat-textarea::placeholder { color: var(--text-tertiary); }
.chat-textarea::-webkit-scrollbar { width: 3px; }
.chat-textarea::-webkit-scrollbar-thumb { background: var(--surface-raised); }

.input-actions {
  display: flex; align-items: center; justify-content: space-between;
  position: relative;
}
.input-actions-right { display: flex; align-items: center; gap: var(--space-2); }

.action-btn {
  display: flex; align-items: center; gap: 6px; padding: 7px 14px;
  background: var(--surface-raised); border: none; border-radius: var(--radius-full);
  color: var(--text-secondary); font-family: var(--font); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: background var(--ease), color var(--ease);
}
.action-btn:hover { background: var(--surface-high); color: var(--text-primary); }
.action-btn.active { background: var(--accent-dim); color: var(--accent); }

.send-btn {
  display: flex; align-items: center; gap: 6px; padding: 7px 18px;
  background: var(--accent); border: none; border-radius: var(--radius-full);
  color: #fff; font-family: var(--font); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: background var(--ease), transform var(--ease);
}
.send-btn:hover { background: var(--accent-hover); }
.send-btn:active { transform: scale(0.97); }

.input-footer {
  font-size: 11px; color: var(--text-tertiary);
  text-align: center; margin-top: var(--space-3); letter-spacing: 0.01em;
}
.input-footer a {
  color: var(--text-secondary); text-decoration: underline;
  text-underline-offset: 2px; transition: color var(--ease);
}
.input-footer a:hover { color: var(--text-primary); }

/* ── Bubbles ── */
.msg-row {
  display: flex; flex-direction: column; gap: 2px; width: 100%;
  animation: fadeUp 0.2s cubic-bezier(.4,0,.2,1) both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg-row.user { align-items: flex-end; }
.bubble-user {
  max-width: 68%; background: var(--accent); color: #ffffff;
  padding: 11px 16px; border-radius: var(--radius-xl);
  border-bottom-right-radius: 4px;
  font-size: 14px; line-height: 1.6; word-break: break-word;
}
.msg-row.ai { align-items: flex-start; }
.bubble-ai {
  max-width: 68%; background: var(--surface-raised); color: var(--text-primary);
  padding: 11px 16px; border-radius: var(--radius-xl);
  border-bottom-left-radius: 4px;
  font-size: 14px; line-height: 1.6; word-break: break-word;
}
.typing-dots { display: flex; align-items: center; gap: 4px; padding: 14px 16px; }
.typing-dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-tertiary); animation: blink 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink {
  0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
  40%           { opacity: 1;    transform: scale(1); }
}

/* ── Context menu ── */
.ctx-menu {
  position: fixed; background: var(--surface-raised);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: var(--space-1); z-index: 999;
  box-shadow: 0 12px 32px rgba(0,0,0,0.6); min-width: 160px;
  animation: scaleIn 0.14s cubic-bezier(.4,0,.2,1) both;
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.96); }
  to   { opacity: 1; transform: scale(1); }
}
.ctx-item {
  display: flex; align-items: center; gap: var(--space-2);
  padding: 8px 12px; border-radius: var(--radius-md); cursor: pointer;
  font-size: 13px; color: var(--text-secondary);
  transition: background var(--ease), color var(--ease);
}
.ctx-item:hover { background: var(--surface-high); color: var(--text-primary); }
.ctx-item.danger { color: var(--red); }
.ctx-item.danger:hover { background: rgba(255,69,58,0.12); color: var(--red); }

/* ── Source menu ── */
.source-menu {
  position: absolute; bottom: calc(100% + 8px); left: 0;
  background: var(--surface-raised); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--space-1);
  min-width: 180px; z-index: 200;
  box-shadow: 0 12px 32px rgba(0,0,0,0.6);
  display: none; animation: scaleIn 0.14s cubic-bezier(.4,0,.2,1) both;
}
.source-menu.open { display: block; }
.source-item {
  display: flex; align-items: center; gap: var(--space-2);
  padding: 8px 12px; border-radius: var(--radius-md); cursor: pointer;
  font-size: 13px; color: var(--text-secondary);
  transition: background var(--ease), color var(--ease);
}
.source-item:hover { background: var(--surface-high); color: var(--text-primary); }
.source-item.selected { color: var(--accent); }
.source-item i { font-size: 12px; width: 14px; text-align: center; }
</style>

    opacity: 0;
    transition: opacity 300ms ease;
  }
  body.page-loaded {

  }

<script>
/* ══════════════════════════════════════
   SIDEBAR — from code 1
══════════════════════════════════════ */
const sidebar = document.getElementById('sidebar');
const current = 'assistant';

sidebar.addEventListener('click', (e) => {
  if (e.target.closest('.nav-item')) return;
  sidebar.classList.toggle('expanded');
});

function initActiveNav() {
  document.querySelectorAll('.nav-item').forEach(item => {
    let label = item.querySelector('.sidebar-label')?.textContent.trim().toLowerCase();
    if (label === 'my courses') label = 'library';
    if (label === 'ask claryo') label = 'assistant';
    if (label === current) item.classList.add('active');
  });
}

function setActive(el) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

/* ══════════════════════════════════════
   ACCOUNT DROPDOWN — from code 1
══════════════════════════════════════ */
function toggleAccount() {
  document.getElementById('accountDropdown').classList.toggle('open');
}
function signIn()   { alert('Sign in clicked'); }
function signOut()  { logout(); }
function goProfile(){ alert('Profile clicked'); }

window.addEventListener('click', (e) => {
  if (!e.target.closest('.account-wrap')) {
    const drop = document.getElementById('accountDropdown');
    if (drop?.classList.contains('open')) drop.classList.remove('open');
  }
});

/* ══════════════════════════════════════
   CHAT HISTORY SIDEBAR TOGGLE
══════════════════════════════════════ */
let chatSidebarOpen = true;
function toggleChatSidebar() {
  const cs     = document.getElementById('chatSidebar');
  const inner  = cs.querySelector('.chat-sidebar-inner');
  const reopen = document.getElementById('reopenBtn');
  chatSidebarOpen = !chatSidebarOpen;

  if (!chatSidebarOpen) {
    cs.dataset.savedWidth    = cs.style.width    || '';
    inner.dataset.savedWidth = inner.style.width || '';
    cs.style.width = ''; inner.style.width = ''; inner.style.minWidth = '';
    cs.classList.add('collapsed');
  } else {
    cs.classList.remove('collapsed');
    if (cs.dataset.savedWidth)    cs.style.width = cs.dataset.savedWidth;
    if (inner.dataset.savedWidth) { inner.style.width = inner.dataset.savedWidth; inner.style.minWidth = inner.dataset.savedWidth; }
  }
  reopen.classList.toggle('visible', !chatSidebarOpen);
}

/* ══════════════════════════════════════
   DOMContentLoaded & CHAT LOGIC
══════════════════════════════════════ */
let activeChatId = null;
let selectedDocumentId = null;

async function loadDocuments() {
  try {
    const res = await fetch(`${API_URL}/documents/`, { headers: authHeaders() });
    if (!res.ok) return;
    const items = await res.json();
    
    selectedDocumentId = null;
    let menu = document.getElementById('sourceMenu');
    if (!menu) {
      const btn = document.getElementById('selectSourceBtn');
      menu = document.createElement('div');
      menu.className = 'source-menu'; menu.id = 'sourceMenu';
      btn.parentElement.appendChild(menu);
    }
    menu.innerHTML = '';
    
    const allItem = document.createElement('div');
    allItem.className = 'source-item selected';
    allItem.innerHTML = `<i class="fas fa-globe"></i> No document selected — search all`;
    allItem.onclick = () => selectDoc(null, 'All Sources', allItem);
    menu.appendChild(allItem);
    
    items.forEach(doc => {
      const item = document.createElement('div');
      const isReady = doc.processing_status === 'ready';
      item.className = 'source-item' + (!isReady ? ' disabled' : '');
      if (!isReady) {
        item.style.opacity = '0.5';
        item.style.cursor = 'not-allowed';
      }
      item.innerHTML = `<i class="fas fa-file-alt"></i> ${doc.name} ${!isReady ? '(processing...)' : ''}`;
      if (isReady) {
        item.onclick = () => selectDoc(doc.id, doc.name, item);
      }
      menu.appendChild(item);
    });
  } catch (err) {
    console.error(err);
  }
}

function selectDoc(id, name, itemEl) {
  selectedDocumentId = id;
  const btn = document.getElementById('selectSourceBtn');
  btn.childNodes[0].textContent = name + ' ';
  document.querySelectorAll('.source-item').forEach(el => el.classList.remove('selected'));
  if (itemEl) itemEl.classList.add('selected');
  closeSourceMenu();
  
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = false;
  sendBtn.title = '';
}

async function loadSessions() {
  const list = document.getElementById('todayList');
  if (list.innerHTML === '') {
    list.innerHTML = Array(4).fill('<div class="skeleton-item"></div>').join('');
  }
  
  try {
    const res = await fetch(`${API_URL}/chat/sessions/`, { headers: authHeaders() });
    if (!res.ok) return;
    const sessions = await res.json();
    
    const list = document.getElementById('todayList');
    list.innerHTML = '';
    
    if (sessions.length === 0) {
      list.innerHTML = '<div style="padding:10px;color:var(--cs-muted);font-size:12px;">No conversations yet.</div>';
    } else {
      sessions.forEach(s => {
        const item = document.createElement('div');
        item.className = 'history-item';
        if (s.id === activeChatId) item.classList.add('active-chat');
        item.dataset.id = s.id;
        const dateStr = new Date(s.last_message_at).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
        item.innerHTML = `<span>${s.title}</span><div style="font-size:10px;opacity:0.6;margin-top:2px;">${dateStr}</div>`;
        item.onclick = () => loadChat(s.id);
        item.oncontextmenu = (e) => showCtx(e, s.id);
        list.appendChild(item);
      });
    }
  } catch (err) {
    console.error(err);
  }
}

async function loadChat(id) {
  activeChatId = id;
  const conv = document.getElementById('conversation');
  conv.innerHTML = '<div class="conv-inner" id="convInner"></div>';
  const inner = document.getElementById('convInner');
  inner.innerHTML = `
    <div class="msg-row user"><div class="bubble-user skeleton-bubble">...</div></div>
    <div class="msg-row ai"><div class="bubble-ai skeleton-bubble">...</div></div>
    <div class="msg-row user"><div class="bubble-user skeleton-bubble">...</div></div>
  `;
  document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active-chat'));
  const el = document.querySelector(`.history-item[data-id="${id}"]`);
  if (el) el.classList.add('active-chat');

  try {
    const res = await fetch(`${API_URL}/chat/sessions/${id}/messages`, { headers: authHeaders() });
    if (!res.ok) {
      const conv = document.getElementById('conversation');
      const errorDiv = document.createElement('div');
      errorDiv.style.cssText = 'padding:10px;text-align:center;color:var(--red);font-size:12px;';
      errorDiv.textContent = 'Error loading chat history.';
      conv.appendChild(errorDiv);
      return;
    }
    const messages = await res.json();
    
    if (!Array.isArray(messages)) return;
    
    // clear skeleton before rendering real messages
    const convInner = document.getElementById('convInner');
    if (convInner) convInner.innerHTML = '';
    
    if (messages.length === 0) {
      document.getElementById('convInner').innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-tertiary);">No messages yet — start the conversation!</div>';
    } else {
      messages.forEach(msg => {
        appendBubble(msg.role, msg.content, false);
      });
    }
    conv.scrollTop = conv.scrollHeight;
  } catch (err) {
    console.error(err);
  }
}

async function newChat(silent = false) {
  if (!silent) {
    activeChatId = null;
    document.getElementById('conversation').innerHTML = `<div class="conv-inner empty" id="convInner"><div class="welcome" id="welcome"><div class="welcome-title">Claryo</div><div class="welcome-sub">Your personal AI-assistant</div></div></div>`;
    document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active-chat'));
    document.getElementById('chatInput').focus();
  }
  
  try {
    const res = await fetch(`${API_URL}/chat/sessions/`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ document_id: selectedDocumentId || null })
    });
    if (res.ok) {
      const session = await res.json();
      activeChatId = session.id;
      if (!silent) {
        await loadSessions();
      } else {
        loadSessions();
      }
      
      if (!silent) {
        document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active-chat'));
        const el = document.querySelector(`.history-item[data-id="${activeChatId}"]`);
        if (el) el.classList.add('active-chat');
      }
    }
  } catch(err) {
    console.error(err);
  }
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  
  const btn = document.getElementById('selectSourceBtn');
  if (btn.childNodes[0].textContent.includes('(processing...)')) {
      alert("Document still processing — please wait.");
      return;
  }
  
  if (!activeChatId) {
     await newChat(true);
  }
  
  appendBubble('user', text);
  input.value = ''; input.style.height = 'auto';
  showTyping();
  
  try {
    const res = await fetch(`${API_URL}/chat/ask/`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        question: text,
        document_id: selectedDocumentId || null,
        session_id: activeChatId
      })
    });
    removeTyping();
    if (res.ok) {
      const data = await res.json();
      appendBubble('ai', data.answer);
      if (data.source_document) {
        appendSourceLabel(data.source_document.name);
      }
      loadSessions();
    } else {
      appendBubble('ai', "Error connecting to server.");
    }
  } catch (err) {
    removeTyping();
    appendBubble('ai', "Failed to get response.");
  }
}

async function deleteChat(id) {
  try {
    const res = await fetch(`${API_URL}/chat/sessions/${id}`, {
      method: 'DELETE',
      headers: authHeaders()
    });
    if (res.ok) {
      if (activeChatId === id) {
        activeChatId = null;
        document.getElementById('conversation').innerHTML = `<div class="conv-inner empty" id="convInner"><div class="welcome" id="welcome"><div class="welcome-title">Claryo</div><div class="welcome-sub">Your personal AI-assistant</div></div></div>`;
      }
      await loadSessions();
    }
  } catch (err) {
    console.error(err);
  }
}

function appendBubble(role, text, scroll = true) {
  const conv = document.getElementById('conversation');
  let inner = document.getElementById('convInner');
  if (!inner || inner.classList.contains('empty')) {
    conv.innerHTML = '<div class="conv-inner" id="convInner"></div>';
    inner = document.getElementById('convInner');
  }
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;
  const bubble = document.createElement('div');
  bubble.className = role === 'user' ? 'bubble-user' : 'bubble-ai';
  bubble.textContent = text;
  row.appendChild(bubble);
  inner.appendChild(row);
  if (scroll) conv.scrollTop = conv.scrollHeight;
}

function showTyping() {
  const conv = document.getElementById('conversation');
  let inner = document.getElementById('convInner');
  if (!inner || inner.classList.contains('empty')) {
    conv.innerHTML = '<div class="conv-inner" id="convInner"></div>';
    inner = document.getElementById('convInner');
  }
  const row = document.createElement('div');
  row.className = 'msg-row ai'; row.id = 'typingRow';
  row.innerHTML = `<div class="bubble-ai typing-dots"><span></span><span></span><span></span></div>`;
  if (inner) inner.appendChild(row);
  conv.scrollTop = conv.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingRow');
  if (t) t.remove();
}

function appendSourceLabel(docName) {
  const inner = document.getElementById('convInner');
  if (inner) {
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.innerHTML = `<div style="font-size:11px;color:var(--text-secondary);margin-top:4px;margin-left:16px;">Sourced from: ${docName}</div>`;
    inner.appendChild(row);
    document.getElementById('conversation').scrollTop = document.getElementById('conversation').scrollHeight;
  }
}

let ctxTarget = null;
function showCtx(e, id) {
  e.preventDefault(); e.stopPropagation();
  removeCtx();
  const menu = document.createElement('div');
  menu.className = 'ctx-menu'; menu.id = 'ctxMenu';
  menu.innerHTML = `
    <div class="ctx-item" onclick="loadChat('${id}');removeCtx()"><i class="fas fa-comment-alt" style="font-size:11px;width:14px;"></i> Open</div>
    <div class="ctx-item danger" onclick="deleteChat('${id}');removeCtx()"><i class="fas fa-trash" style="font-size:11px;width:14px;"></i> Delete</div>`;
  let x = e.clientX, y = e.clientY;
  document.body.appendChild(menu);
  if (x + menu.offsetWidth  > window.innerWidth  - 8) x = window.innerWidth  - menu.offsetWidth  - 8;
  if (y + menu.offsetHeight > window.innerHeight - 8) y = window.innerHeight - menu.offsetHeight - 8;
  menu.style.left = x + 'px'; menu.style.top = y + 'px';
}
function removeCtx() {
  const m = document.getElementById('ctxMenu');
  if (m) m.remove();
}
document.addEventListener('click', () => removeCtx());
document.addEventListener('keydown', e => { if (e.key === 'Escape') { removeCtx(); closeSourceMenu(); } });

function toggleSourceMenu() {
  const menu = document.getElementById('sourceMenu');
  if (menu) menu.classList.toggle('open');
}
function closeSourceMenu() {
  const m = document.getElementById('sourceMenu');
  if (m) m.classList.remove('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('#selectSourceBtn') && !e.target.closest('#sourceMenu')) {
    closeSourceMenu();
  }
});

window.addEventListener('DOMContentLoaded', () => {
  initActiveNav();
  loadDocuments();
  loadSessions();
  
  const chatInput = document.getElementById('chatInput');
  if (chatInput) {
    chatInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
  }
});

const style = document.createElement('style');
style.textContent = `
  @keyframes shimmer {
    0%   { opacity: 0.4; }
    50%  { opacity: 0.7; }
    100% { opacity: 0.4; }
  }
  .skeleton-bubble {
    color: transparent !important;
    animation: shimmer 1.5s ease-in-out infinite;
    min-width: 100px;
  }
  .skeleton-item {
    height: 36px;
    border-radius: var(--radius-md);
    background-color: var(--surface-high);
    animation: shimmer 1.5s infinite;
    margin-bottom: 8px;
  }
`;
document.head.appendChild(style);
</script>
